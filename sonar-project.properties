sonar.projectKey=VizHome_frontend-vizhome
sonar.projectName=VizHome Frontend
sonar.organization=vizhome

# ─── Sources & exclusions ────────────────────────────────────────────────
sonar.sources=app.vue,components,composables,layouts,middleware,pages,plugins,server,utils,lib
sonar.exclusions=**/node_modules/**,**/.nuxt/**,**/.output/**,**/dist/**,**/components/ui/**,**/*.config.{ts,js,mjs}

# ─── Tests ───────────────────────────────────────────────────────────────
sonar.tests=tests
sonar.test.inclusions=**/*.test.{ts,vue},**/*.spec.{ts,vue}
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# ─── Encoding ────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
