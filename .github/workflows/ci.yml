name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. Lint ESLint ─────────────────────────────────────────────────────
  lint:
    name: Lint (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --no-cache
      - run: npm ci
      - run: npm run lint -- --max-warnings 0

  # ─── 2. Type check vue-tsc ─────────────────────────────────────────────
  typecheck:
    name: Type check (nuxi typecheck)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --no-cache
      - run: npm ci
      - run: npm run typecheck || true

  # ─── 3. Tests Vitest + coverage ────────────────────────────────────────
  test:
    name: Tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run tests + coverage
        run: npx vitest run --coverage --reporter=verbose --reporter=junit --outputFile=junit.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            junit.xml
          retention-days: 7

      - name: Upload to Codecov
        if: success() && github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  # ─── 4. Build Nuxt (vérifie qu'il compile en mode prod) ────────────────
  build:
    name: Nuxt build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --no-cache
      - run: npm ci
      - name: Build SSR
        env:
          NUXT_PUBLIC_API_URL: /api/v1
          NUXT_API_PROXY_TARGET: http://api:8000
        run: npm run build
      - name: Verify .output exists
        run: |
          ls -la .output/server/
          du -sh .output/

      - uses: actions/upload-artifact@v4
        with:
          name: nuxt-build
          path: .output/
          retention-days: 3

  # ─── 5. Build & smoke-test Docker image ────────────────────────────────
  docker-build:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: vizhome-frontend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (container démarre + répond /)
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e NUXT_PUBLIC_API_URL=/api/v1 \
            vizhome-frontend:ci-${{ github.sha }}
          # Attente démarrage Nuxt
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 >/dev/null 2>&1; then
              echo "✓ container répond"
              exit 0
            fi
            sleep 2
          done
          echo "::warning::container n'a pas répondu en 60s"
          docker logs smoke
          exit 0  # non-bloquant pour l'instant

      - name: Cleanup
        if: always()
        run: docker rm -f smoke || true

      - name: Inspect image
        run: |
          docker images vizhome-frontend:ci-${{ github.sha }} \
            --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}"

  # ─── 6. Scan vulnérabilités Trivy ──────────────────────────────────────
  trivy:
    name: Trivy vuln scan
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image for scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: vizhome-frontend:trivy-${{ github.sha }}
          cache-from: type=gha

      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: vizhome-frontend:trivy-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-frontend

  # ─── 7. npm audit (deps connues vulnérables) ───────────────────────────
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm audit --audit-level=high --omit=dev || true
